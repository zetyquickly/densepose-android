plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Machine-specific paths live in local.properties (not in git):
//   ndk.path=<Android NDK>                      optional, else the SDK's side-by-side ndkVersion
//   fnl.tflite.src=<tensorflow checkout>        TFLite sources the engine was built against
//   fnl.tflite.build=<TFLite cmake build dir>   arm64-v8a, android-31, GPU delegate on (see export/engine/README.md)
//   fnl.engine.dir=<DensePoseFnL>/export/engine       override of the pinned engine (default third_party/DensePoseFnL/export/engine)
//   fnl.models.dir=<DensePoseFnL>/export/out/litert   override of the models dir (default third_party/DensePoseFnL/export/out/litert);
//                                                     dirs of graph_{a,b1,b2,c}.tflite, one per name in fnl.models
//   fnl.models=cse,cse_portrait,cse_800,cse_800_portrait   graph sets bundled into the APK (dirs of graph_{a,b1,b2,c}.tflite)
def localProps = new Properties()
rootProject.file('local.properties').withInputStream { localProps.load(it) }
def prop = { String key, String fallback -> localProps.getProperty(key, fallback) }

def required = { String key ->
    def v = localProps.getProperty(key)
    if (v == null) throw new GradleException("Set ${key} in local.properties (see the top of app/build.gradle)")
    v
}
// the engine is pinned as a submodule; the properties only override it for local development
def pinned = rootProject.file('third_party/DensePoseFnL')
def engineDir = file(prop('fnl.engine.dir', "${pinned}/export/engine")).canonicalPath
def modelsDir = file(prop('fnl.models.dir', "${pinned}/export/out/litert")).canonicalPath
def tfliteSrc = required('fnl.tflite.src')
def tfliteBuild = required('fnl.tflite.build')
def bundledModels = prop('fnl.models', 'cse,cse_portrait,cse_800,cse_800_portrait').split(',').collect { it.trim() }

android {
    namespace 'com.skoltech.densepose'
    compileSdk 34
    ndkVersion '27.3.13750724'
    if (localProps.getProperty('ndk.path') != null) ndkPath localProps.getProperty('ndk.path')

    defaultConfig {
        applicationId 'com.example.densepose'
        // the prebuilt TFLite targets android-31
        minSdk 31
        targetSdk 34
        versionCode 2
        versionName '2.0'

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                targets 'fnl_jni'
                arguments "-DFNL_ENGINE_DIR=${engineDir}",
                        "-DTFLITE_SRC_DIR=${tfliteSrc}",
                        "-DTFLITE_BUILD_DIR=${tfliteBuild}",
                        '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets.main.assets.srcDir("$buildDir/generated/fnl_assets")

    androidResources {
        // assets.openFd() (ModelStore) needs them stored
        noCompress 'tflite', 'bin'
    }

}

tasks.register('syncModels', Copy) {
    into "$buildDir/generated/fnl_assets/models"
    bundledModels.each { name ->
        from("${modelsDir}/${name}") {
            include 'graph_a.tflite', 'graph_b1.tflite', 'graph_b2.tflite', 'graph_c.tflite'
            into name
        }
    }
    doFirst {
        bundledModels.each { name ->
            ['graph_a', 'graph_b1', 'graph_b2', 'graph_c'].each { g ->
                if (!file("${modelsDir}/${name}/${g}.tflite").exists())
                    throw new GradleException("missing ${modelsDir}/${name}/${g}.tflite (see export_litert.py)")
            }
        }
    }
}
tasks.named('preBuild') { dependsOn 'syncModels' }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'

    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
}
